<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrolling Text with Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .scrolling-box {
      width: 100%;
      height: 50px;
      background-color: #ADD8E6; /* Biru muda */
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
    }
    .scrolling-text {
      display: flex;
      align-items: center;
      position: absolute;
      white-space: nowrap;
      animation: scroll-left 10s linear infinite;
    }
    .scrolling-text img {
      width: 30px;
      height: 30px;
      margin: 0 10px;
    }
    @keyframes scroll-left {
      0% {
        left: 100%;
      }
      100% {
        left: -100%;
      }
    }
  </style>
</head>

</body>
</html>
