<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Card Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .custom-card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      font-size: 0.85rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease;
    }

    .custom-card:hover {
      transform: scale(1.03);
    }

    .custom-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .custom-card .card-body {
      padding: 10px;
    }

    .custom-caption {
      font-size: 0.8rem;
      color: #555;
      margin: 0;
      width: 10%;
    }

    .card-title {
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row g-3">

      <!-- Card 1 -->
      <div class="col-6 col-md-4">
        <a href="detail1.html" class="custom-card card">
          <img src="https://source.unsplash.com/random/200x140?sig=1" alt="Gambar">
          <div class="card-body">
            <h6 class="card-title">Akun 1</h6>
            <p class="custom-caption">Caption untuk kartu 1.</p>
          </div>
        </a>
      </div>

      <!-- Card 2 -->
      <div class="col-6 col-md-4">
        <a href="detail2.html" class="custom-card card">
          <img src="https://source.unsplash.com/random/200x140?sig=2" alt="Gambar">
          <div class="card-body">
            <h6 class="card-title">Akun 2</h6>
            <p class="custom-caption">Caption untuk kartu 2.</p>
          </div>
        </a>
      </div>

      <!-- Card 3 -->
      <div class="col-6 col-md-4">
        <a href="detail3.html" class="custom-card card">
          <img src="https://source.unsplash.com/random/200x140?sig=3" alt="Gambar">
          <div class="card-body">
            <h6 class="card-title">Akun 3</h6>
            <p class="custom-caption">Caption untuk kartu 3.</p>
          </div>
        </a>
      </div>

    </div>
  </div>
</body>
</html>
